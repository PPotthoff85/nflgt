const NAMES = Object.keys(D.teams);
const nW = Object.keys(D.weeks).length;
const de = (x, nd = 2) => Number(x).toLocaleString('de-DE', { minimumFractionDigits: nd, maximumFractionDigits: nd });
const $ = (id) => document.getElementById(id);
const logo = (team, cls = 'logo') => `<img class="${cls}" src="${LOGOS[D.teams[team].logo]}" alt="" width="44" height="44">`;

/* ---------- Berechnung ---------- */
function weekRanks(w) {
  const rows = D.weeks[w].slice().sort((a, b) => b.pts - a.pts);
  const m = {};
  rows.forEach((r, i) => { m[r.team] = { rank: i + 1, rp: NAMES.length - (i + 1), ...r }; });
  return m;
}
function standings(upto) {
  const acc = {};
  NAMES.forEach((t) => { acc[t] = { team: t, rp: 0, tot: 0, ranks: [], pts: [] }; });
  for (let w = 1; w <= upto; w++) {
    const m = weekRanks(w);
    NAMES.forEach((t) => { acc[t].rp += m[t].rp; acc[t].tot += m[t].pts; acc[t].ranks.push(m[t].rank); acc[t].pts.push(m[t].pts); });
  }
  const list = Object.values(acc).sort((a, b) => b.rp - a.rp || b.tot - a.tot);
  list.forEach((r, i) => { r.pos = i + 1; });
  return list;
}

function showTab(k) {
  Object.entries(tabs).forEach(([key, id]) => {
    $(id).hidden = key !== k;
    $('t-' + key).setAttribute('aria-selected', key === k ? 'true' : 'false');
  });
  try { localStorage.setItem('nflgt-tab', k); } catch (e) {}
}
Object.keys(tabs).forEach((k) => $('t-' + k).addEventListener('click', () => showTab(k)));

/* ---------- Tabelle ---------- */
function renderTable() {
  const cur = standings(nW);
  const prev = nW > 1 ? standings(nW - 1) : null;
  const prevPos = {};
  if (prev) prev.forEach((r) => { prevPos[r.team] = r.pos; });
  let h = `<p class="legend"><b>① Rangpunkte</b> zählen zuerst: pro Spieltag 9 für die meisten Punkte bis 0 für die wenigsten. <b>② Gesamtpunkte</b> entscheiden bei Gleichstand.</p>
    <div class="th"><div style="text-align:center">Pl.</div><div></div><div>Team</div><div>Rang</div><div>Gesamt</div></div><div class="tbl">`;
  cur.forEach((r) => {
    if (r.pos === 3) h += `<div class="sep gold">Plätze 1–2 sicher in den Playoffs</div>`;
    if (r.pos === 3) h += `<div class="sep">Plätze 3–6 spielen zwei weitere Halbfinalisten aus</div>`;
    if (r.pos === 7) h += `<div class="sep">Ab hier nur mit Aufholjagd</div>`;
    let mv = '<span class="mv flat">–</span>';
    if (prev) {
      const d = prevPos[r.team] - r.pos;
      mv = d > 0 ? `<span class="mv up">▲${d}</span>` : d < 0 ? `<span class="mv down">▼${-d}</span>` : '<span class="mv flat">–</span>';
    }
    const chips = r.ranks.map((k) => `<span class="f ${k <= 3 ? 't' : k >= 8 ? 'b' : ''}">${k}</span>`).join('');
    const det = r.ranks.map((k, i) => `<tr><td>Spieltag ${i + 1}</td><td>${de(r.pts[i])}</td><td>Platz ${k}</td><td>+${NAMES.length - k}</td></tr>`).join('');
    h += `<button class="row" type="button" aria-expanded="false" data-team="${r.team}">
      <div class="pos">${r.pos}${mv}</div><div>${logo(r.team)}</div>
      <div style="min-width:0"><div class="name">${r.team}</div><div class="mgr">${D.teams[r.team].mgr} · ${D.teams[r.team].owner}</div><div class="form" aria-label="Platzierungen je Spieltag">${chips}</div></div>
      <div class="rp">${r.rp}</div><div class="tot">${de(r.tot)}</div></button>
      <div class="detail" hidden><table><thead><tr><th>&nbsp;</th><th>Punkte</th><th>Platz</th><th>Rangpkt.</th></tr></thead><tbody>${det}</tbody></table></div>`;
  });
  h += `</div>`;

  // Saison-Rekorde
  const all = [];
  for (let w = 1; w <= nW; w++) D.weeks[w].forEach((r) => all.push({ ...r, w }));
  const best = all.reduce((a, b) => (b.pts > a.pts ? b : a));
  const worst = all.reduce((a, b) => (b.pts < a.pts ? b : a));
  const waste = all.reduce((a, b) => (b.opt - b.pts > a.opt - a.pts ? b : a));
  const eff = NAMES.map((t) => {
    const rows = all.filter((r) => r.team === t);
    return { t, e: rows.reduce((s, r) => s + r.pts, 0) / rows.reduce((s, r) => s + r.opt, 0) };
  }).sort((a, b) => b.e - a.e)[0];
  h += `<div class="card"><div class="ctitle">Saison-Rekorde</div><div class="tiles">
    <div class="tile"><div class="k">Bester Spieltag</div><div class="v">${de(best.pts)}</div><div class="d">${best.team} · Spieltag ${best.w}</div></div>
    <div class="tile"><div class="k">Schwächster Spieltag</div><div class="v">${de(worst.pts)}</div><div class="d">${worst.team} · Spieltag ${worst.w}</div></div>
    <div class="tile"><div class="k">Am meisten verschenkt</div><div class="v">${de(waste.opt - waste.pts, 1)}</div><div class="d">${waste.team} · Sp. ${waste.w}: mit optimaler Aufstellung wären es ${de(waste.opt, 1)} gewesen</div></div>
    <div class="tile"><div class="k">Beste Aufstellung</div><div class="v">${de(eff.e * 100, 1)}%</div><div class="d">${eff.t} holt im Schnitt so viel vom Möglichen</div></div>
  </div></div>`;
  $('v-tab').innerHTML = h;
  $('v-tab').querySelectorAll('.row').forEach((b) => b.addEventListener('click', () => {
    const d = b.nextElementSibling;
    d.hidden = !d.hidden;
    b.setAttribute('aria-expanded', d.hidden ? 'false' : 'true');
  }));
}

/* ---------- Spieltage ---------- */
let curWeek = nW;
function renderWeeks() {
  const chips = Array.from({ length: nW }, (_, i) => i + 1)
    .map((w) => `<button class="chip" type="button" data-w="${w}" aria-pressed="${w === curWeek}">Spieltag ${w}</button>`).join('');
  const m = weekRanks(curWeek);
  const rows = Object.values(m).sort((a, b) => a.rank - b.rank);
  const mx = rows[0].pts;
  const wasteMax = Math.max(...rows.map((r) => r.opt - r.pts));
  const benchMax = Math.max(...rows.map((r) => r.bench));
  const list = rows.map((r) => {
    const d = r.pts - r.proj;
    const tag = r.rank === 1 ? '<span class="pill a">Tagessieg</span>' : '';
    const w = r.opt - r.pts === wasteMax ? '<span class="pill r">Meiste Punkte verschenkt</span>' : '';
    return `<div class="wr"><div class="n">${r.rank}</div><div>${logo(r.team)}</div>
      <div style="min-width:0"><div class="name">${r.team}${tag}</div>
        <div class="bar" role="img" aria-label="${de(r.pts)} Punkte"><i style="width:${(100 * r.pts / mx).toFixed(1)}%"></i></div>
        <div class="m">${d >= 0 ? '+' : '−'}${de(Math.abs(d), 1)} ggü. Projektion · Optimum ${de(r.opt, 1)}${w}</div></div>
      <div class="p">${de(r.pts)}<div class="m" style="text-align:right;font-family:var(--f-body)">+${r.rp} Rang</div></div></div>`;
  }).join('');
  const top = rows[0], flop = rows[rows.length - 1];
  const over = rows.slice().sort((a, b) => (b.pts - b.proj) - (a.pts - a.proj))[0];
  const under = rows.slice().sort((a, b) => (a.pts - a.proj) - (b.pts - b.proj))[0];
  const benchTop = rows.find((r) => r.bench === benchMax);
  $('v-spt').innerHTML = `<div class="card"><div class="chips" role="group" aria-label="Spieltag wählen">${chips}</div></div>
    <div class="card"><div class="ctitle">Ergebnis Spieltag ${curWeek}</div>${list}</div>
    <div class="card"><div class="ctitle">Auffällig</div><div class="tiles">
      <div class="tile"><div class="k">Über Erwartung</div><div class="v up">+${de(over.pts - over.proj, 1)}</div><div class="d">${over.team}</div></div>
      <div class="tile"><div class="k">Unter Erwartung</div><div class="v down">−${de(Math.abs(under.pts - under.proj), 1)}</div><div class="d">${under.team}</div></div>
      <div class="tile"><div class="k">Stärkste Bank</div><div class="v">${de(benchMax, 1)}</div><div class="d">${benchTop.team} ließ so viele Punkte draußen</div></div>
      <div class="tile"><div class="k">Abstand 1. zu 10.</div><div class="v">${de(top.pts - flop.pts, 1)}</div><div class="d">${top.team} vs. ${flop.team}</div></div>
    </div></div>
    <p class="foot"><b>Projektion</b> = Sleeper-Erwartung für die aufgestellten Spieler. <b>Optimum</b> = beste mögliche Aufstellung aus dem gesamten Kader. <b>Bank</b> = Punkte der nicht aufgestellten Spieler.</p>`;
  $('v-spt').querySelectorAll('.chip').forEach((b) => b.addEventListener('click', () => { curWeek = Number(b.dataset.w); renderWeeks(); }));
}

/* ---------- Historie ---------- */
function person(mgr, teamName, cls = 'who') {
  if (mgr && D.mgrTeam[mgr]) {
    const t = D.mgrTeam[mgr];
    return `<div class="${cls}">${logo(t, 'logo')}<div style="min-width:0"><div class="a">${mgr}</div><div class="b">${teamName}</div></div></div>`;
  }
  const ini = teamName.split(/\s+/).slice(0, 2).map((s) => s[0]).join('').toUpperCase();
  return `<div class="${cls}"><div class="ph">${ini}</div><div style="min-width:0"><div class="a">${teamName}</div><div class="b">ehemaliger Mitspieler</div></div></div>`;
}
function renderHistory() {
  let hof = `<div class="hl h"><div>Jahr</div><div>Meister</div><div>Vizemeister</div></div><div class="era">NFL Fantasy · 2016–2021</div>`;
  D.finals.forEach((f, i) => {
    if (f.year === 2022) hof += `<div class="era">Sleeper · seit 2022</div>`;
    hof += `<div class="hl"><div class="y">${f.year}</div>${person(f.champ[1], f.champ[0])}${person(f.vice[1], f.vice[0], 'who v')}</div>`;
  });
  const stats = Object.entries(D.career).map(([who, s]) => {
    const c = (s.match(/C/g) || []).length, f = c + (s.match(/F/g) || []).length, p = f + (s.match(/P/g) || []).length;
    return { who, s, c, f, p, n: s.replace(/-/g, '').length };
  }).sort((a, b) => b.c - a.c || b.f - a.f || b.p - a.p);
  const yrs = D.years.map((y) => `<div>${String(y).slice(2)}</div>`).join('');
  const cellTxt = { C: '🏆', F: 'V', P: 'P', N: '', '-': '' };
  const cls = { C: 'cm', F: 'cf', P: 'cp', N: '', '-': 'cx' };
  const et = stats.map((r) => `<div class="er"><div class="nm">${logo(D.mgrTeam[r.who], 'logo')}<span>${r.who}</span></div>
    <div class="strip">${[...r.s].map((ch) => `<div class="c ${cls[ch]}">${cellTxt[ch]}</div>`).join('')}</div>
    <div class="v ${r.c ? '' : 'z'}">${r.c}</div><div class="v ${r.f ? '' : 'z'}">${r.f}</div><div class="v ${r.p ? '' : 'z'}">${r.p}</div></div>`).join('');
  const facts = D.facts.map((f) => `<div class="tile fact"><div class="k">${f.k}</div><div class="x">${f.x}</div><div class="t">${f.t}</div><div class="d">${f.d}</div></div>`).join('');
  $('v-his').innerHTML = `<div class="card"><div class="hero"><div class="big">3×</div><div><div class="t">Rekordmeister: Patrick</div><div class="d">2016, 2017 und 2021. Einziger Titelverteidiger der Liga-Geschichte.</div></div></div></div>
    <div class="card"><div class="ctitle">Hall of Fame</div>${hof}
      <p class="foot" style="margin-top:10px"><b>Seit 2022 nach unserem Format:</b> Hauptrunde Woche 1–14 nach Rangpunkten, Plätze 1–2 direkt weiter, in Woche 15 kommen die zwei Punktbesten der Plätze 3–6 weiter, Finale = Summe aus Woche 16 und 17. 2016–2021: Endplatzierung laut NFL-Fantasy-Archiv.</p></div>
    <div class="card"><div class="ctitle">Ewige Tabelle</div><div class="scroll"><div class="et">
      <div class="er h"><div>Manager</div><div class="strip yr">${yrs}</div><div style="text-align:center">🏆</div><div style="text-align:center">Top 2</div><div style="text-align:center">PO</div></div>${et}</div></div>
      <div class="leg"><span><span class="c cm">🏆</span>Meister</span><span><span class="c cf">V</span>Vizemeister</span><span><span class="c cp">P</span>Playoffs</span><span><span class="c"></span>verpasst</span><span><span class="c cx"></span>nicht dabei</span></div>
      <p class="foot" style="margin-top:10px">Playoffs = Top 6. Alte Teams ohne heutigen Manager sind nicht zugeordnet.</p></div>
    <div class="card"><div class="ctitle">Harte Fakten</div><div class="tiles">${facts}</div></div>`;
}

$('stand').textContent = `Saison 2026 · nach Spieltag ${nW}`;
renderTable(); renderWeeks(); renderHistory();
let start = 'tab';
try { const s = localStorage.getItem('nflgt-tab'); if (s && tabs[s]) start = s; } catch (e) {}
showTab(start);
</script>
</body></html>
